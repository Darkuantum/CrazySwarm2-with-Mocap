# named list of all robots
#
# >>> FILL IN <<<  three things per drone, and they are the three that decide
# whether the show is safe:
#
#   enabled          true only if `ros2 run crazyflie scan --address 0x...`
#                    answers TODAY. One unreachable enabled drone wedges the
#                    whole server silently and forever (HANDOVER.md 6).
#   uri              channel AND datarate must match what the drone actually
#                    answers on. A 2M URI for a 1M drone hangs the server with
#                    no error.
#   initial_position metres, world frame. Take it from /poses, NEVER from
#                    /cfX/pose (HANDOVER.md 6). This is what the entire show
#                    plan is derived from, so get it right BEFORE running
#                    plan_show. swarm_show refuses to arm if a drone's live
#                    pose is more than 0.25 m from the value here.
#
# After editing: no rebuild needed, but the launch must be restarted (this
# file is read once at launch), and re-run `ros2 run crazyflie_shows plan_show`.
fileversion: 3

robots:
  cf1:
    enabled: true
    uri: radio://*/80/2M/E7E7E7E701
    initial_position: [-0.9862, 0.6485, 0.0]
    type: cf21  # see robot_types

  cf2:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E702
    initial_position: [0.0307, -0.1084, 0.0]
    type: cf21  # see robot_types

  cf3:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E703
    initial_position: [1.2211, -1.1161, 0.0]
    type: cf21  # see robot_types

  cf5:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E705
    initial_position: [-0.9008, -1.3117, 0.0]
    type: cf21  # see robot_types

  cf8:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E708
    initial_position: [0.9565, 0.8603, 0]
    type: cf21  # see robot_types

robot_types:
  cf21:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      # only if enabled; see motion_capture.yaml
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
    #   enabled: true
    #   default_topics:
    #   pose:
    #     frequency: 1 # Hz
    #   custom_topics:
    #    topic_name3: 
    #      frequency: 1
    #      vars: ["acc.x", "acc.y", "acc.z"]
    # reference_frame: "odom" 

  cf21_mocap_deck:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      # only if enabled; see motion_capture.yaml
      marker: default_single_error
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
    #   enabled: true
    #   default_topics:
    #   pose:
    #     frequency: 1 # Hz
    #   custom_topics:
    #    topic_name3: 
    #      frequency: 1
    #      vars: ["acc.x", "acc.y", "acc.z"]
    # reference_frame: "mocap" 

# global settings for all robots
all:
  # firmware logging for all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  firmware_logging:
    enabled: true
    default_topics:
     # remove to disable default topic
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
    custom_topics:
      # estimator:
      #   frequency: 5 #was 50
      #   vars:
      #     - stateEstimate.x
      #     - stateEstimate.y
      #     - stateEstimate.z
      #     - stateEstimate.yaw   # values[3], degrees (Kalman-estimated heading)
      # # MOCAP-FREE onboard telemetry for safety_watchdog.py. Deliberately NO
      # # stateEstimate.* here: with estimator=2 that position is fused with the
      # # mocap pose and inherits mocap drift. These are pure IMU / baro / firmware
      # # supervisor signals, valid even when the mocap frame has drifted.
      # safety_att:                 # 5 floats = 20 B (log-block limit is 26 B)
      #   frequency: 20 # Hz
      #   vars:
      #     - stabilizer.roll       # deg   (attitude est: gyro+accel)
      #     - stabilizer.pitch      # deg
      #     - gyro.x                # deg/s (raw rate gyro)
      #     - gyro.y                # deg/s
      #     - gyro.z                # deg/s
      # safety_sys:                 # 3 floats + uint16 = 14 B
      #   frequency: 20 # Hz
      #   vars:
      #     - stabilizer.thrust     # 0..65535 (controller collective thrust)
      #     - baro.asl              # m     (barometric altitude)
      #     - pm.vbat               # V
      #     - supervisor.info       # bitfield: is_flying/is_tumbled/is_crashed
      kalman_preflight:           # preflight plotter; 22 B of 26 B log-block budget
        # every var below must exist in each enabled drone's firmware log TOC.
        # motion.*/range.* are present in stock firmware even with no flow
        # deck attached (they just read 0); custom/trimmed firmware lacking
        # them makes the cpp crazyflie_server abort at connect.
        frequency: 5 # Hz
        vars:
          - kalman.stateX         # float, m
          - kalman.stateY         # float, m
          - kalman.stateZ         # float, m
          - motion.deltaX         # int16, flow px
          - motion.deltaY         # int16, flow px
          - range.zrange          # uint16, mm
          - stateEstimateZ.vx     # int16, mm/s
          - stateEstimateZ.vy     # int16, mm/s
      # attitude:
      #   frequency: 10 # was 50
      #   vars:
      #     - stabilizer.roll
      #     - stabilizer.pitch
      #     - stabilizer.yaw
      # kalman:
      #   frequency: 10 # was 50 
      #   vars:
      #     - kalman.stateX
      #     - kalman.stateY
      #     - kalman.stateZ
    #custom_topics:
    #  topic_name1:
    #    frequency: 10 # Hz
    #    vars: ["stateEstimateZ.x", "stateEstimateZ.y", "stateEstimateZ.z", "pm.vbat"]
    #  topic_name2:
    #    frequency: 1 # Hz
    #    vars: ["stabilizer.roll", "stabilizer.pitch", "stabilizer.yaw"]
  # firmware parameters for all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2 # 1: complementary, 2: kalman
      controller: 1 # 1: PID, 2: mellinger
    # ring:
    #   effect: 16 # 6: double spinner, 7: solid color, 16: packetRate
    #   solidBlue: 255 # if set to solid color
    #   solidGreen: 0 # if set to eans the rigid-body pose solid color
    #   solidRed: 0 # if set to solid color
    #   headlightEnable: 0
    locSrv:
      extPosStdDev: 1e-3 #was 1e-3
      extQuatStdDev: 0.5e-1
    kalman:
      resetEstimation: 1
  # reference frame for on-board state-estimate of all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  reference_frame: "world"
  broadcasts:
    num_repeats: 15 # number of times broadcast commands are repeated
    delay_between_repeats_ms: 1 # delay in milliseconds between individual repeats
