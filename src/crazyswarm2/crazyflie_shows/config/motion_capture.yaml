/motion_capture_tracking:
  ros__parameters:
    # one of "optitrack", "optitrack_closed_source", "vicon", "qualisys", "nokov", "vrpn", "motionanalysis"
    type:  "optitrack" #"optitrack_closed_source"
    # >>> FILL IN <<<  the machine running Motive.
    # MUST be a literal dotted quad -- this backend does NOT resolve hostnames
    # and aborts with "boost ... Invalid argument" if given a name.
    # Find it with: scripts/mocap_diag.sh   (reports the NatNet sender)
    hostname: "192.168.9.124" #"192.168.8.63"
    # ------------------------------------------------------------------
    # interface_ip IS A NO-OP IN THIS BUILD. Proven by strace 2026-09-07:
    # whatever you put here, ros-humble-motion-capture-tracking 1.0.9 always
    # calls
    #   setsockopt(IP_ADD_MEMBERSHIP, {group, imr_interface=141.23.110.162})
    # The ROS node declares the parameter but never forwards it to
    # MotionCaptureOptitrack(), so the library's default 141.23.110.162
    # (upstream TU-Berlin address, baked into the binary) is used instead.
    # If that address is not on this machine the join returns ENODEV and the
    # node aborts with "set_option: No such device".
    #
    # THE ACTUAL FIX -- put the address the node insists on onto the motive
    # NIC. Deliberately NOT made permanent (operator's choice), so it must be
    # re-applied EVERY SESSION, and after every Wi-Fi reconnect:
    #     sudo ip addr add 141.23.110.162/32 dev wlp131s0f0
    # Verify with: ip -o -f inet addr show dev wlp131s0f0
    # NetworkManager drops it on reconnect/carrier loss (seen twice on 09-04),
    # which is exactly what made this look intermittent. (Historical: the
    # vendored driver does not need this address; mocap_verify.sh, which checked
    # for it, was removed 2026-09-18.)
    #
    # Left here only so the value is not silently re-introduced as a "fix".
    # ------------------------------------------------------------------
    interface_ip: "192.168.9.108"   # inert; see above

    topics:
      frame_id: "world" #mocap
      poses:
        qos:
          mode: "sensor"
          deadline: 50.0 # 240.0 Hz
      tf:
        child_frame_id: "{}_mocap" #"cf1" 

    marker_configurations:
      default: # for standard Crazyflie
        offset: [0.0, 0.0, 0.0]
        points:
          p0: [   0.0,    0.0, 0.022]  # top
          p1: [-0.042,  0.042, 0.0  ]  # back left   (M3)
          p2: [-0.042, -0.042, 0.0  ]  # back right  (M2)
          p3: [ 0.042, -0.042, 0.0  ]  # front right (M1)
      default_single_marker:
        offset: [0.0, -0.01, -0.04]
        points:
          p0: [0.0177184,0.0139654,0.0557585]
      mocap_deck:
        offset: [0.0, 0.0, -0.01]
        points:
          p0: [0.03, 0.0, 0.0] # front
          p1: [0.00, -0.03, 0.0] # right
          p2: [-0.015, 0.0, 0.0] # back
          p3: [0.00, 0.03, 0.0] # left
      medium_frame:
        offset: [0.0, 0.0, -0.03]
        points:
          p0: [-0.00896228,-0.000716753,0.0716129]
          p1: [-0.0156318,0.0997402,0.0508162]
          p2: [0.0461693,-0.0881012,0.0380672]
          p3: [-0.0789959,-0.0269793,0.0461144]
      big_frame:
        offset: [0.0, 0.0, -0.06]
        points:
          p0: [0.0558163,-0.00196302,0.0945539]
          p1: [-0.0113941,0.00945842,0.0984811]
          p2: [-0.0306277,0.0514879,0.0520456]
          p3: [0.0535816,-0.0400775,0.0432799]

    dynamics_configurations:
      default:
        max_velocity: [2, 2, 3] # m/s
        max_angular_velocity: [20, 20, 10] # rad/s
        max_roll: 1.4 #rad
        max_pitch: 1.4 #rad
        max_fitness_score: 0.001

    # Rigid bodies will be automatically generated by the launch file
    # rigid_bodies:
