# named list of all robots
fileversion: 3

robots:
  cf1:
    enabled: true
    # radio://0/, not radio://*/: the wildcard dongle works with backend:=cpp
    # (crazyflie-link-cpp resolves it) but CRASHES backend:=cflib, whose
    # radiodriver does get_serials().index('*') -> ValueError "Cannot find radio
    # with serial *". cf1 then fails, and the python server exits with "one or
    # more Crazyflies can not be found", so NOTHING comes up (2026-10-02).
    # This rig has one dongle, so the wildcard bought nothing.
    uri: radio://0/80/2M/E7E7E7E701
    initial_position: [0.8356, -0.9873, 0.0]
    type: cf21  # see robot_types

  cf2:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E702
    initial_position: [-1.1581, -1.0394, 0.0]
    type: cf21  # see robot_types

  cf3:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E703
    initial_position: [0.8311, 0.9646, 0.0]
    type: cf21  # see robot_types

  cf5:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E705
    initial_position: [-0.1549, -0.01, 0.0]
    type: cf21  # see robot_types

  cf8:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E708
    # Silent on 0 of 6 scan passes 2026-10-02 (cf1-cf5 all answered) -- not
    # powered or not in the room. Do not enable without a scan that answers:
    # one unreachable enabled drone blocks the server's connect loop silently.
    # Its old mark [0.9584, 0.8613] also sits 0.164 m from where cf3 now
    # stands, so this mark cannot be used until cf8 is re-placed and synced.
    initial_position: [0.9584, 0.8613, 0.0]
    type: cf21  # see robot_types

  cf4:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E704
    # Answered at 2M on 2026-10-02 (1 of 3 passes -- the scan is intermittent,
    # see HANDOVER; it IS alive). It is therefore the drone most likely to
    # block the server's connect loop, so scan it first:
    # ./scripts/scan_fleet.sh
    # This mark is 1.431 m from cf5's -- clear of the 1 m rig rule, and both
    # plan_show and plan_constellation report PLAN OK on it. (A comment here
    # claimed 0.89 m and "every planner will refuse"; both were wrong, and a
    # comment that tells the operator a passing check is failing trains them
    # to distrust the file that IS ground truth.)
    initial_position: [-1.1371, 1.0309, 0.0]
    type: cf21  # see robot_types

robot_types:
  cf21:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      # only if enabled; see motion_capture.yaml
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
    #   enabled: true
    #   default_topics:
    #   pose:
    #     frequency: 1 # Hz
    #   custom_topics:
    #    topic_name3: 
    #      frequency: 1
    #      vars: ["acc.x", "acc.y", "acc.z"]
    # reference_frame: "odom" 

  cf21_mocap_deck:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      # only if enabled; see motion_capture.yaml
      marker: default_single_error
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
    #   enabled: true
    #   default_topics:
    #   pose:
    #     frequency: 1 # Hz
    #   custom_topics:
    #    topic_name3: 
    #      frequency: 1
    #      vars: ["acc.x", "acc.y", "acc.z"]
    # reference_frame: "mocap" 

# global settings for all robots
all:
  # firmware logging for all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  firmware_logging:
    enabled: true
    default_topics:
     # remove to disable default topic
      pose:
        # 10 Hz, as upstream AI-DA-STC ships it. MEASURED 2026-10-02: lowering
        # this to 2 Hz to save radio airtime was a mistake twice over -- the
        # link warnings it was meant to cure are chronic on this rig (every run
        # since June, including the 09-17 show that flew with 22% bad seconds on
        # cf3), and a slower pose rate gives the preflight placement gate fewer
        # chances to see a drone before it gives up.
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
    custom_topics:
      # estimator:
      #   frequency: 5 #was 50
      #   vars:
      #     - stateEstimate.x
      #     - stateEstimate.y
      #     - stateEstimate.z
      #     - stateEstimate.yaw   # values[3], degrees (Kalman-estimated heading)
      # # MOCAP-FREE onboard telemetry for safety_watchdog.py. Deliberately NO
      # # stateEstimate.* here: with estimator=2 that position is fused with the
      # # mocap pose and inherits mocap drift. These are pure IMU / baro / firmware
      # # supervisor signals, valid even when the mocap frame has drifted.
      # safety_att:                 # 5 floats = 20 B (log-block limit is 26 B)
      #   frequency: 20 # Hz
      #   vars:
      #     - stabilizer.roll       # deg   (attitude est: gyro+accel)
      #     - stabilizer.pitch      # deg
      #     - gyro.x                # deg/s (raw rate gyro)
      #     - gyro.y                # deg/s
      #     - gyro.z                # deg/s
      # safety_sys:                 # 3 floats + uint16 = 14 B
      #   frequency: 20 # Hz
      #   vars:
      #     - stabilizer.thrust     # 0..65535 (controller collective thrust)
      #     - baro.asl              # m     (barometric altitude)
      #     - pm.vbat               # V
      #     - supervisor.info       # bitfield: is_flying/is_tumbled/is_crashed
      kalman_preflight:           # preflight plotter; 22 B of 26 B log-block budget
        # every var below must exist in each enabled drone's firmware log TOC.
        # motion.*/range.* are present in stock firmware even with no flow
        # deck attached (they just read 0); custom/trimmed firmware lacking
        # them makes the cpp crazyflie_server abort at connect.
        frequency: 5 # Hz
        vars:
          - kalman.stateX         # float, m
          - kalman.stateY         # float, m
          - kalman.stateZ         # float, m
          - motion.deltaX         # int16, flow px
          - motion.deltaY         # int16, flow px
          - range.zrange          # uint16, mm
          - stateEstimateZ.vx     # int16, mm/s
          - stateEstimateZ.vy     # int16, mm/s
      # attitude:
      #   frequency: 10 # was 50
      #   vars:
      #     - stabilizer.roll
      #     - stabilizer.pitch
      #     - stabilizer.yaw
      # kalman:
      #   frequency: 10 # was 50 
      #   vars:
      #     - kalman.stateX
      #     - kalman.stateY
      #     - kalman.stateZ
    #custom_topics:
    #  topic_name1:
    #    frequency: 10 # Hz
    #    vars: ["stateEstimateZ.x", "stateEstimateZ.y", "stateEstimateZ.z", "pm.vbat"]
    #  topic_name2:
    #    frequency: 1 # Hz
    #    vars: ["stabilizer.roll", "stabilizer.pitch", "stabilizer.yaw"]
  # firmware parameters for all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2 # 1: complementary, 2: kalman
      controller: 1 # 1: PID, 2: mellinger
    # ring:
    #   effect: 16 # 6: double spinner, 7: solid color, 16: packetRate
    #   solidBlue: 255 # if set to solid color
    #   solidGreen: 0 # if set to eans the rigid-body pose solid color
    #   solidRed: 0 # if set to solid color
    #   headlightEnable: 0
    locSrv:
      extPosStdDev: 1e-3 #was 1e-3
      extQuatStdDev: 0.5e-1
    kalman:
      resetEstimation: 1
  # reference frame for on-board state-estimate of all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  reference_frame: "world"
  broadcasts:
    num_repeats: 15 # number of times broadcast commands are repeated
    delay_between_repeats_ms: 1 # delay in milliseconds between individual repeats
