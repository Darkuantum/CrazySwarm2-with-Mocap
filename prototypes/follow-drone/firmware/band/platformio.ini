; PlatformIO project configuration for the follow-drone wearable gesture/ranging band.
;
; Target: generic ESP32 dev board, Arduino framework.
;
; NOTE: this project has NOT been built or flashed on real hardware. PlatformIO
; is not installed in the environment this firmware was written in. Review the
; library versions below against what is actually available before your first
; build, and expect a couple of iterations to shake out include-path issues.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Match Serial.begin() in main.cpp. Keep these in sync.
monitor_speed = 115200
upload_speed = 921600

; The ESP32 BLE Arduino API (BLEDevice.h / BLEServer.h / BLECharacteristic.h)
; ships inside the arduino-esp32 core itself -- it is NOT a separate
; lib_deps entry. Only third-party libraries need to be listed here.
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit Unified Sensor@^1.1.14

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; Keep the BLE stack's default MTU negotiation; our packets are tiny
    ; (<= 16 bytes) so we never need to raise it.

; Serial Monitor filters: decode ESP32 exception backtraces to source lines.
monitor_filters = esp32_exception_decoder
